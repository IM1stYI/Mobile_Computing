<script>
  (function initSplashScreen() {
    const progressBar = document.getElementById('pwa-progress-bar');
    const percentLabel = document.getElementById('loading-percent-text');
    const statusLabel = document.getElementById('loading-status-text');
    const enterButton = document.getElementById('btn-masuk-portal');

    const steps = [
      { progress: '35%', text: 'Memuat modul autentikasi...', pct: '35%' },
      { progress: '65%', text: 'Memverifikasi aset laboratorium...', pct: '65%' },
      { progress: '100%', text: 'Sistem siap digunakan', pct: '100%' }
    ];

    let currentStep = 0;
    const interval = setInterval(() => {
      if (currentStep < steps.length) {
        if (progressBar && percentLabel && statusLabel) {
          progressBar.style.width = steps[currentStep].progress;
          percentLabel.textContent = steps[currentStep].pct;
          statusLabel.textContent = steps[currentStep].text;
        }
        currentStep++;
      } else {
        clearInterval(interval);
        if (enterButton) {
          enterButton.classList.add('animate-bounce');
          setTimeout(() => enterButton.classList.remove('animate-bounce'), 1200);
        }
      }
    }, 700);

    if (enterButton) {
      enterButton.addEventListener('click', () => {
        enterButton.innerHTML = `
          <span class="inline-block w-4 h-4 border-2 border-on-secondary border-t-transparent rounded-full animate-spin"></span>
          <span>Membuka Gerbang Kampus...</span>
        `;
      });
    }
  })();
